name: Build PlayTorrio Android TV

on:
  push:
    branches: [google-tv-32bit-v7]
    tags: ['v*']
  pull_request:
    branches: [google-tv-32bit-v7]
  workflow_dispatch:

env:
  FLUTTER_CHANNEL: stable

permissions:
  contents: read

jobs:
  android-tv:
    name: Android TV APKs (ARMv7 and ARM64)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - flavor: googleTv32
            platform: android-arm
            abi: armeabi-v7a
            artifact: PlayTorrio-GoogleTV-ARMv7
          - flavor: universal
            platform: android-arm64
            abi: arm64-v8a
            artifact: PlayTorrio-GoogleTV-ARM64

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: ${{ env.FLUTTER_CHANNEL }}
          cache: true

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK and NDK
        run: |
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0" "ndk;27.0.12077973"
          yes | sdkmanager --licenses >/dev/null || true

      - name: Get dependencies
        run: flutter pub get

      - name: Analyze Dart source
        run: flutter analyze --no-fatal-infos

      - name: Build APK
        run: >-
          flutter build apk
          --release
          --flavor ${{ matrix.flavor }}
          --target-platform ${{ matrix.platform }}
          --dart-define=PLAYTORRIO_GOOGLE_TV=true

      - name: Verify APK output and native libraries
        shell: bash
        run: |
          set -euo pipefail
          APK="build/app/outputs/flutter-apk/app-${{ matrix.flavor }}-release.apk"

          if [[ ! -s "$APK" ]]; then
            echo "APK was not created: $APK" >&2
            exit 1
          fi

          echo "Built $APK ($(du -h "$APK" | cut -f1))"

          # Native libraries are optional for builds whose dependencies contain no
          # native code. Do not make a successful APK fail on an empty ABI folder.
          if unzip -l "$APK" | grep -Fq "lib/${{ matrix.abi }}/"; then
            echo "Verified native ABI: ${{ matrix.abi }}"
          else
            echo "No packaged native libraries found for ${{ matrix.abi }}; continuing."
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: build/app/outputs/flutter-apk/app-${{ matrix.flavor }}-release.apk
          if-no-files-found: error
