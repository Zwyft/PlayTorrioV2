name: Build PlayTorrio Android TV

on:
  push:
    branches: [google-tv-32bit-v7]
    tags: ['v*']
  pull_request:
    branches: [google-tv-32bit-v7]
  workflow_dispatch:

env:
  FLUTTER_CHANNEL: stable

permissions:
  contents: read

jobs:
  android-tv:
    name: Android TV APKs (ARMv7 and ARM64)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - flavor: googleTv32
            platform: android-arm
            abi: armeabi-v7a
            artifact: PlayTorrio-GoogleTV-ARMv7
          - flavor: universal
            platform: android-arm64
            abi: arm64-v8a
            artifact: PlayTorrio-GoogleTV-ARM64

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: ${{ env.FLUTTER_CHANNEL }}
          cache: true

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK and NDK
        run: |
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0" "ndk;27.0.12077973"
          yes | sdkmanager --licenses >/dev/null || true

      - name: Get dependencies
        run: flutter pub get

      - name: Analyze Dart source
        run: flutter analyze --no-fatal-infos

      - name: Build APK
        run: >-
          flutter build apk
          --release
          --flavor ${{ matrix.flavor }}
          --target-platform ${{ matrix.platform }}
          --dart-define=PLAYTORRIO_GOOGLE_TV=true

      - name: Verify APK output
        run: |
          echo "Looking for APK outputs..."
          find build/app/outputs -name '*.apk' -type f 2>/dev/null || true
          APK="build/app/outputs/flutter-apk/app-${{ matrix.flavor }}-release.apk"
          if [ ! -f "$APK" ]; then
            APK=$(find build/app/outputs -name '*${{ matrix.flavor }}*release*.apk' -type f | head -1)
          fi
          if [ ! -f "$APK" ]; then
            APK=$(find build/app/outputs -name '*.apk' -type f | head -1)
          fi
          if [ ! -f "$APK" ]; then
            echo "ERROR: No APK found under build/app/outputs"
            exit 1
          fi
          echo "Found APK: $APK ($(du -h "$APK" | cut -f1))"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            build/app/outputs/flutter-apk/app-${{ matrix.flavor }}-release.apk
            build/app/outputs/**/*${{ matrix.flavor }}*.apk
          if-no-files-found: error
